<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carespear | Scam Detector</title>
    <style>
        :root {
            font-family: system-ui, sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        body {
            max-width: 760px;
            margin: 0 auto;
            padding: 3rem 1.25rem;
        }

        h1 {
            color: #2457d6;
            margin-bottom: .5rem;
        }

                .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            box-shadow: 0 4px 18px #17203318;
            }

        textarea {
            box-sizing: border-box;
            width: 100%;
            margin-top: .5rem;
            padding: .75rem;
            border: 1px solid #bbc5d6;
            border-radius: 8px;
            font: inherit;
            resize: vertical;
        }

        button {
            margin-top: 1rem;
            padding: .7rem 1.1rem;
            border: 0;
            border-radius: 8px;
            color: white;
            background: #2457d6;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #1b43aa;
        }

        .error {
            color: #a51d2d;
            font-weight: 600;
        }

        .explanation {
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <main>
        <h1>Carespear</h1>
        <p>Paste a suspicious message below to check its risk level.</p>

        <form class="card" method="POST" action="/">
            <label for="message"><strong>Message to analyze</strong></label>
            <textarea id="message" name="message" rows="6"
                      required autocomplete="off">{{ message|default("") }}</textarea>
            <button type="submit">Analyze message</button>
        </form>

        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        {% if risk_level is defined %}
            <section class="card" aria-live="polite">
                <h2>Analysis result: {{ risk_level }}</h2>
                <p class="explanation">{{ explanation }}</p>
            </section>
        {% endif %}
    </main>
</body>
</html>
